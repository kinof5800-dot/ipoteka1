<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ипотека таңдау тесті</title>
<style>
:root{--bg:#f3efe6;--card:#fff;--tx:#0b1f33;--mu:#5e6b7a;--ac:#0e7c66;--ac2:#dff3ec;--bd:#e3ddcf;--gd:#f5b83d;--hs:#0b2a43;--he:#0e7c66;--wa:#1fae5b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08121c;--card:#122233;--tx:#f1f4f8;--mu:#9bacbd;--ac:#3ecfae;--ac2:#14392f;--bd:#22384d;--hs:#0a1a2a;--he:#0e6b59}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:480px;margin:0 auto;min-height:100vh;padding:0 0 90px}
.hero{background:linear-gradient(155deg,var(--hs),var(--he));color:#fff;padding:34px 22px 46px;border-radius:0 0 34px 34px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(245,184,61,.55),transparent 70%)}
.hero h1{font-size:34px;line-height:1.1;margin:14px 0 12px;font-weight:800;letter-spacing:-.5px;position:relative}
.hero p{margin:0;opacity:.88;position:relative}
.ico{font-size:40px;position:relative}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;position:relative}
.chips span{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600}
.pad{padding:0 18px}
.go{display:block;width:calc(100% - 36px);margin:-26px 18px 0;position:relative;background:var(--gd);color:#2a1d00;border:0;border-radius:18px;padding:18px;font:inherit;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 10px 24px rgba(245,184,61,.35)}
.go:active{transform:scale(.98)}
.note{color:var(--mu);font-size:13px;text-align:center;margin:18px 22px}
.top{padding:18px 18px 6px}
.seg{display:flex;gap:5px;margin-bottom:10px}
.seg i{flex:1;height:5px;border-radius:3px;background:var(--bd)}
.seg i.on{background:var(--ac)}
.back{background:none;border:0;color:var(--mu);font:inherit;padding:6px 0;cursor:pointer}
.q{padding:10px 18px 0;animation:up .3s ease}
.q h2{font-size:26px;line-height:1.2;margin:6px 0 20px;font-weight:800;letter-spacing:-.3px}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:11px;font:inherit;font-weight:600;cursor:pointer;min-height:62px}
.opt b{flex:none;width:34px;height:34px;border-radius:11px;background:var(--ac2);color:var(--ac);display:grid;place-items:center;font-size:15px}
.opt:active,.opt.sel{border-color:var(--ac);background:var(--ac2);transform:scale(.99)}
.rh{padding:22px 18px 6px;animation:up .3s ease}
.rh h1{font-size:30px;line-height:1.1;margin:0 0 8px;font-weight:800;letter-spacing:-.5px}
.rh p{margin:0;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--ac);border-radius:18px;padding:16px;margin:12px 18px;animation:up .35s ease both}
.card.f{background:linear-gradient(155deg,var(--hs),var(--he));color:#fff;border:0}
.card.f .mu{color:rgba(255,255,255,.8)}
.lb{display:inline-block;background:var(--gd);color:#2a1d00;font-size:12px;font-weight:800;border-radius:20px;padding:3px 10px;margin-bottom:8px}
.nm{font-size:20px;font-weight:800;line-height:1.2}
.mu{color:var(--mu);font-size:14px}
a.wa{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:14px;background:var(--wa);color:#fff;text-decoration:none;border-radius:14px;padding:14px;font-weight:700;min-height:50px}
a.wa svg{width:22px;height:22px;fill:#fff}
.ex{font-size:14px;padding:9px 0;border-top:1px solid var(--bd)}
details.x{margin:12px 18px;background:var(--card);border:1px solid var(--bd);border-radius:18px}
details.x summary{padding:14px 16px;cursor:pointer;font-weight:700}
details.x .in{padding:0 16px 12px}
.again{display:block;width:calc(100% - 36px);margin:14px 18px;background:transparent;color:var(--tx);border:2px solid var(--bd);border-radius:14px;padding:14px;font:inherit;font-weight:700;cursor:pointer}
.dis{color:var(--mu);font-size:12px;margin:14px 22px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:calc(100% - 36px);max-width:444px;display:flex;align-items:center;justify-content:center;gap:9px;background:var(--wa);color:#fff;text-decoration:none;border-radius:16px;padding:15px;font-weight:800;box-shadow:0 10px 26px rgba(31,174,91,.45)}
.fab svg{width:22px;height:22px;fill:#fff}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script>
var WA='77000702072';
var WS='<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.1c-.2.6-1.300 1.200-1.800 1.200-.5.1-1 .2-3.300-.7-2.800-1.200-4.600-4-4.700-4.200-.1-.2-1.100-1.500-1.100-2.800s.7-2 1-2.300c.2-.3.500-.3.700-.3h.5c.2 0 .4 0 .6.500l.9 2.200c.1.200.1.400 0 .600l-.4.600-.5.500c-.2.2-.3.400-.1.700.2.300.8 1.300 1.800 2.100 1.200 1 2.200 1.300 2.500 1.500.3.100.5.100.7-.1l1-1.200c.2-.3.400-.2.700-.1l2 1c.3.100.5.200.6.300.1.200.1.800-.1 1.400z"/></svg>';
var N=['new','ready','green'],R=['ready','green'],AL=['new','ready','sec','green'];
var Q=[
{k:'own',t:'Сіздің немесе жұбайыңыздың меншігінде тұрғын үй бар ма?',o:[['no','Жоқ, бірінші үй'],['yes','Иә, бар']]},
{k:'dep',t:'Отбасы банкте тұрғын үй жинағыңыз (депозит) бар ма?',o:[['none','Жоқ'],['short','Бар, 3 жылға дейін'],['long','Бар, 3 жылдан көп']]},
{k:'down',t:'Үй құнының қанша бөлігі өз қаражатыңызда бар?',o:[['0','10%-дан аз'],['10','10–19%'],['20','20–29%'],['30','30–49%'],['50','50% және одан көп']]},
{k:'job',t:'Қай салада жұмыс істейсіз?',o:[['ind','Өнеркәсіп, көлік, ауыл шаруашылығы, энергетика'],['oth','Басқа сала немесе бюджет (ресми табыс)'],['self','Табысым ресми расталмайды']]},
{k:'type',t:'Қандай үй қарастырудасыз?',o:[['new','Жаңа ЖК, құрылыс үстінде'],['ready','Жаңа ЖК, пайдалануға берілген'],['sec','Қайталама баспана'],['green','«Жасыл» сертификаты (OMIR) бар ЖК']]},
{k:'city',t:'Үйді қай жерден іздейсіз?',o:[['big','Алматы, Астана'],['mid','Шымкент, Атырау, Ақтау'],['oth','Басқа өңір']]},
{k:'wait',t:'Үйді қашан сатып алу керек?',o:[['fast','Тез, 1–3 ай ішінде'],['wait','Күте аламын, іріктеуден өтуге дайынмын']]}
];
var PR=[
{n:'50/50',o:'Отбасы банк',r:7,d:50,ty:AL},
{n:'30/70',o:'Отбасы банк',r:7,d:30,ty:N},
{n:'«Наурыз»',o:'Отбасы банк, мемлекеттік',r:9,d:10,ty:N,dep:1,no:1,sel:1},
{n:'«Наурыз жұмыскер»',o:'Отбасы банк, мемлекеттік',r:9,d:20,ty:N,dep:1,no:1,ind:1,sel:1},
{n:'«7-20-25»',o:'Мемлекеттік, банктер арқылы',r:7,d:20,ty:R,no:1,off:1,sel:1},
{n:'Жасыл ипотека',o:'Отбасы банк',r:12.5,d:20,ty:['green'],off:1},
{n:'Береке банк ипотекасы',o:'Bereke Bank',r:21.7,d:20,ty:AL},
{n:'«Алтын ұя»',o:'Altyn Bank',r:[[20,16],[70,7]],d:20,ty:AL},
{n:'«Свой дом»',o:'Отбасы банк',r:8.5,d:30,ty:N},
{n:'Цифрлық ипотека',o:'Halyk Bank',r:22,d:20,ty:R},
{n:'Серіктес ипотека',o:'Halyk Bank (BI Group)',r:[[20,18.5],[70,5]],d:20,ty:N},
{n:'Ипотека под заклад',o:'ForteBank',r:[[30,15],[70,5]],d:30,ty:R},
{n:'JAÑA ипотека',o:'Банк ЦентрКредит',r:[[20,15.45],[70,5]],d:20,ty:R},
{n:'Каскадты ипотека',o:'Freedom Bank',r:20,d:20,ty:N},
{n:'Стандартты ипотека',o:'Нурбанк',r:21.5,d:20,ty:N},
{n:'Серіктес ипотека',o:'Bank RBK',r:[[20,19.8],[70,1.6]],d:20,ty:N},
{n:'Стандартты ипотека',o:'Altyn Bank',r:22.4,d:20,ty:R}
];
var A={},i=-1,app=document.getElementById('app');
function rt(r,d){if(typeof r=='number')return r;if(d<=r[0][0])return r[0][1];for(var k=1;k<r.length;k++){if(d<=r[k][0]){var a=r[k-1],b=r[k];return a[1]+(b[1]-a[1])*(d-a[0])/(b[0]-a[0])}}return r[r.length-1][1]}
function link(t){return 'https://wa.me/'+WA+'?text='+encodeURIComponent(t)}
function card(p,f,idx){return '<div class="card'+(f?' f':'')+'" style="animation-delay:'+(idx*.06)+'s">'+(f?'<span class="lb">Бірінші ұсыныс</span><br>':'')+'<div class="nm">'+p.n+'</div><div class="mu">'+p.o+'</div><a class="wa" href="'+link('Сәлеметсіз бе! Мені «'+p.n+'» ('+p.o+') ипотекасы қызықтырады. Тегін консультация алғым келеді.')+'" target="_blank" rel="noopener">'+WS+'Тегін консультация алу</a></div>'}
function start(){A={};i=-1;render()}
function pick(k,v){A[k]=v;i++;render()}
function render(){
 window.scrollTo(0,0);
 if(i<0){app.innerHTML='<div class="hero"><div class="ico">🏠</div><h1>Өзіңізге сай ипотеканы табыңыз</h1><p>7 қысқа сұраққа жауап беріңіз, біз 17 бағдарламаның ішінен өзіңізге қолайлыларын таңдап береміз.</p><div class="chips"><span>⏱ 2 минут</span><span>17 бағдарлама</span><span>Тегін</span></div></div><button class="go" onclick="i=0;render()">Тестті бастау</button><p class="note">Нәтиже қаржылық кеңес емес. Шарттарды консультацияда нақтылаңыз.</p>';return}
 if(i>=Q.length){return result()}
 var q=Q[i],h='',s='';
 for(var k=0;k<Q.length;k++)s+='<i'+(k<=i?' class="on"':'')+'></i>';
 q.o.forEach(function(o,n){h+='<button class="opt'+(A[q.k]==o[0]?' sel':'')+'" onclick="pick(\''+q.k+'\',\''+o[0]+'\')"><b>'+'ABCDE'.charAt(n)+'</b><span>'+o[1]+'</span></button>'});
 app.innerHTML='<div class="top"><div class="seg">'+s+'</div><button class="back" onclick="i--;render()">← '+(i>0?'Артқа':'Басты бет')+'</button></div><div class="q"><h2>'+q.t+'</h2>'+h+'</div>';
}
function result(){
 var d=+A.down,ok=[],no=[];
 PR.forEach(function(p){
  var why='';
  if(p.no&&A.own=='yes')why='Тұрғын үйі жоқтарға арналған';
  else if(p.dep&&A.dep=='none')why='Отбасы банкте жинақ қажет';
  else if(d<p.d)why='Өз қаражатыңыз кемінде '+p.d+'% болуы керек';
  else if(p.ty.indexOf(A.type)<0)why='Таңдаған үй түріне жарамайды';
  else if(p.ind&&A.job!='ind')why='Өнеркәсіп, көлік, ауыл шаруашылығы, энергетика қызметкерлеріне';
  else if(p.off&&A.job=='self')why='Ресми табыс қажет';
  if(why){no.push([p,why]);return}
  ok.push({p:p,sc:rt(p.r,d)*(p.sel&&A.wait=='fast'?1.25:1)});
 });
 ok.sort(function(a,b){return a.sc-b.sc});
 var h='<div class="rh"><h1>'+(ok.length?'Сізге '+ok.length+' бағдарлама сәйкес':'Толық сәйкестік табылмады')+'</h1><p>'+(ok.length?'Әрқайсысы бойынша тегін консультация алыңыз.':'Өз қаражатыңызды көбейтіп немесе үй түрін өзгертіп көріңіз.')+'</p></div>';
 ok.forEach(function(x,n){h+=card(x.p,n==0,n)});
 if(no.length){h+='<details class="x"><summary>Сәйкес келмейтіндер ('+no.length+')</summary><div class="in">';no.forEach(function(x){h+='<div class="ex"><b>'+x[0].n+'</b> <span class="mu">'+x[0].o+'</span><br><span class="mu">'+x[1]+'</span></div>'});h+='</div></details>'}
 h+='<button class="again" onclick="start()">Тестті қайта өту</button><p class="dis">Шарттар жиі өзгереді. Өтінім беру алдында банктің ресми сайтында немесе консультацияда тексеріңіз.</p><a class="fab" href="'+link('Сәлеметсіз бе! Ипотека бойынша тегін консультация алғым келеді.')+'" target="_blank" rel="noopener">'+WS+'Консультантқа жазу</a>';
 app.innerHTML=h;
}
render();
</script>
</body>
</html>
